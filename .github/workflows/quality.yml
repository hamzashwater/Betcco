name: Quality

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-classifier
          fetch-depth: 1
          persist-credentials: false
      - name: Classify exact pull-request paths
        id: classify
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if [ -f .trusted-classifier/.github/scripts/classify_docs_only.py ]; then
              python3 .trusted-classifier/.github/scripts/classify_docs_only.py
            else
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "Trusted classifier is absent from the PR base; full CI required."
            fi
          else
            python3 .github/scripts/classify_docs_only.py
          fi

  full-quality:
    name: Full application quality
    needs: classify
    if: ${{ always() && needs.classify.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_DB: betcco_ci
          POSTGRES_USER: betcco_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U betcco_ci -d betcco_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=betcco_ci;Username=betcco_ci;Password=ci-only-password
      BETCCO_TEST_POSTGRES_ADMIN: Host=localhost;Port=5432;Database=postgres;Username=betcco_ci;Password=ci-only-password
      ASPNETCORE_ENVIRONMENT: Testing
      BETCCO_API_URL: http://localhost:5085
      BETCCO_NEXT_DIST_DIR: .next-ci
      BETCCO_TEST_S3_ENDPOINT: http://localhost:9000
      BETCCO_TEST_S3_ACCESS_KEY: betcco-ci
      BETCCO_TEST_S3_SECRET_KEY: ci-only-minio-password
      BETCCO_TEST_S3_BUCKET: betcco-ci-private
      MINIO_COMMUNITY_IMAGE: betcco/minio-community:2025-10-15
      MINIO_ROOT_USER: betcco-ci
      MINIO_ROOT_PASSWORD: ci-only-minio-password
      MINIO_PRIVATE_BUCKET: betcco-ci-private
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate production Docker base image digests
        run: python3 .github/scripts/validate_docker_base_images.py
      - name: Test production Docker base image validator
        run: python3 .github/scripts/test_validate_docker_base_images.py
      - name: Validate immutable release artifact contract
        run: python3 .github/scripts/test_validate_release_images.py
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x
      - name: Start private S3-compatible test storage
        run: |
          docker build --pull --file infra/minio/Dockerfile --tag "$MINIO_COMMUNITY_IMAGE" .
          docker run --detach --rm --name betcco-minio --publish 9000:9000 \
            --env MINIO_ROOT_USER=betcco-ci \
            --env MINIO_ROOT_PASSWORD=ci-only-minio-password \
            "$MINIO_COMMUNITY_IMAGE" server /data
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:9000/minio/health/ready >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then docker logs betcco-minio; exit 1; fi
            sleep 2
          done
          docker run --rm --network host \
            --entrypoint /bin/sh \
            "$MINIO_COMMUNITY_IMAGE" -c \
            "mc alias set betcco http://localhost:9000 betcco-ci ci-only-minio-password && mc mb --ignore-existing betcco/betcco-ci-private && mc anonymous set none betcco/betcco-ci-private"
          anonymous_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:9000/betcco-ci-private)"
          if [ "$anonymous_status" != "403" ]; then
            echo "Expected anonymous bucket access to return 403, got $anonymous_status"
            exit 1
          fi
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Frontend format, lint, types and tests
        run: |
          pnpm --dir frontend format:check
          pnpm --dir frontend lint
          pnpm --dir frontend typecheck
          pnpm --dir frontend test
      - name: Build frontend
        run: pnpm --dir frontend build
      - name: Restore .NET tools and dependencies
        run: |
          dotnet tool restore
          dotnet restore backend/Betcco.sln --locked-mode
      - name: Verify .NET formatting and build
        run: |
          dotnet format backend/Betcco.sln --verify-no-changes
          dotnet build backend/Betcco.sln --no-restore
      - name: Apply migrations to an empty PostgreSQL database
        run: dotnet tool run dotnet-ef database update --project backend/src/Betcco.Infrastructure --startup-project backend/src/Betcco.Api
      - name: Verify PostgreSQL backup and isolated restore
        env:
          BETCCO_POSTGRES_CLIENT_IMAGE: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
          PGPASSWORD: ci-only-password
        run: |
          docker run --rm --network host \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$RUNNER_TEMP:/recovery" \
            --workdir /workspace \
            --env PGHOST=127.0.0.1 \
            --env PGPORT=5432 \
            --env PGUSER=betcco_ci \
            --env PGPASSWORD \
            --env PGDATABASE=betcco_ci \
            --env RECOVERY_BACKUP_DIR=/recovery \
            --env GITHUB_RUN_ID \
            --env GITHUB_RUN_ATTEMPT \
            "$BETCCO_POSTGRES_CLIENT_IMAGE" \
            bash scripts/run-postgres-recovery-drill.sh
      - name: Verify S3 private-object recovery
        run: dotnet test backend/tests/Betcco.IntegrationTests --no-build --no-restore --filter FullyQualifiedName~S3PrivateObjectRecoveryTests
      - name: Verify Data Protection key-ring recovery
        run: dotnet test backend/tests/Betcco.IntegrationTests --no-build --no-restore --filter FullyQualifiedName~DataProtectionRecoveryTests
      - name: Run .NET tests including required PostgreSQL finance and S3 storage tests
        run: dotnet test backend/Betcco.sln --no-build --no-restore
      - name: Prepare standalone frontend for Playwright
        run: |
          cp -R frontend/public frontend/.next-ci/standalone/public
          mkdir -p frontend/.next-ci/standalone/.next-ci
          cp -R frontend/.next-ci/static frontend/.next-ci/standalone/.next-ci/static
      - name: Run public Playwright smoke tests
        run: pnpm --dir frontend exec playwright test tests/e2e/public.spec.ts
      - name: Validate Docker compose syntax
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: |
          docker compose config --quiet
          docker compose --env-file deploy.env.example --file compose.deploy.yml --profile operations config --format json > "$RUNNER_TEMP/deploy-compose.json"
          python3 - "$RUNNER_TEMP/deploy-compose.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as config_file:
              services = json.load(config_file)["services"]
          assert services["migrate"]["image"] == services["api"]["image"]
          assert services["api"]["image"].endswith("@sha256:" + "0" * 64)
          assert services["web"]["image"].endswith("@sha256:" + "0" * 64)
          assert all("build" not in services[name] for name in ("migrate", "api", "web"))
          PY
      - name: Build non-root production images
        run: |
          docker build --file backend/src/Betcco.Api/Dockerfile --tag betcco-api:ci .
          docker build --file frontend/Dockerfile --tag betcco-web:ci .
      - name: Verify controlled migration command from the production API image
        run: |
          docker run --rm --network host \
            --env ASPNETCORE_ENVIRONMENT=Testing \
            --env 'ConnectionStrings__Postgres=Host=localhost;Port=5432;Database=betcco_ci;Username=betcco_ci;Password=ci-only-password' \
            betcco-api:ci --migrate
      - name: Verify production API image health endpoints
        run: |
          docker run --detach --name betcco-api-smoke --network host \
            --env ASPNETCORE_ENVIRONMENT=Testing \
            --env 'ConnectionStrings__Postgres=Host=localhost;Port=5432;Database=betcco_ci;Username=betcco_ci;Password=ci-only-password' \
            betcco-api:ci
          trap 'docker rm --force betcco-api-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then docker logs betcco-api-smoke; exit 1; fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/health/live >/dev/null

  application-gate:
    name: Application quality
    needs: [classify, full-quality]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources for documentation validation
        if: ${{ github.event_name == 'pull_request' && needs.classify.result == 'success' && needs.classify.outputs.docs_only == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: ${{ github.event_name == 'pull_request' && needs.classify.result == 'success' && needs.classify.outputs.docs_only == 'true' }}
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-classifier
          fetch-depth: 1
          persist-credentials: false
      - name: Recheck documentation-only allowlist
        id: docs-paths
        if: ${{ github.event_name == 'pull_request' && needs.classify.result == 'success' && needs.classify.outputs.docs_only == 'true' }}
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .trusted-classifier/.github/scripts/classify_docs_only.py
      - name: Check documentation diff whitespace
        id: docs-diff
        if: ${{ github.event_name == 'pull_request' && needs.classify.result == 'success' && needs.classify.outputs.docs_only == 'true' && steps.docs-paths.outputs.docs_only == 'true' }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$PR_BASE_SHA" "$PR_HEAD_SHA" --
      - name: Require successful classification and the correct validation path
        if: ${{ always() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          FULL_QUALITY_RESULT: ${{ needs.full-quality.result }}
          DOCS_PATHS_RESULT: ${{ steps.docs-paths.outcome }}
          DOCS_DIFF_RESULT: ${{ steps.docs-diff.outcome }}
        run: |
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "Path classification did not succeed; required gate fails closed."
            exit 1
          fi
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$DOCS_ONLY" = "true" ]; then
            if [ "$DOCS_PATHS_RESULT" != "success" ] || [ "$DOCS_DIFF_RESULT" != "success" ]; then
              echo "Documentation validation did not complete successfully."
              exit 1
            fi
          elif [ "$FULL_QUALITY_RESULT" != "success" ]; then
            echo "Full Application Quality did not succeed."
            exit 1
          fi
