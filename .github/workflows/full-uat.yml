name: Full UAT Matrix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uat:
    name: Full-stack browser UAT
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_DB: betcco_uat
          POSTGRES_USER: betcco_uat
          POSTGRES_PASSWORD: uat-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U betcco_uat -d betcco_uat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:latest@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
        ports:
          - 1025:1025
          - 8025:8025

    env:
      ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=betcco_uat;Username=betcco_uat;Password=uat-${{ github.run_id }}
      ASPNETCORE_ENVIRONMENT: Development
      BETCCO_API_URL: http://127.0.0.1:5085
      BETCCO_NEXT_DIST_DIR: .next-uat
      BETCCO_E2E_API: "1"
      SEED_ADMIN_EMAIL: admin-uat@betcco.test
      SEED_ADMIN_PASSWORD: UatAdmin-${{ github.run_id }}-Aa!
      APP_PUBLIC_URL: https://localhost:3000
      BETCCO_UAT_BASE_URL: https://localhost:3000
      BETCCO_UAT_TLS_CERT: /tmp/betcco-uat.crt
      BETCCO_UAT_TLS_KEY: /tmp/betcco-uat.key

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --dir frontend exec playwright install --with-deps chromium firefox webkit

      - name: Restore and build API
        run: |
          dotnet tool restore
          dotnet restore backend/Betcco.sln
          dotnet build backend/Betcco.sln --no-restore

      - name: Start development API with seeded UAT data
        run: |
          nohup dotnet run --project backend/src/Betcco.Api --no-build --urls http://127.0.0.1:5085 > /tmp/betcco-api.log 2>&1 &
          echo $! > /tmp/betcco-api.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5085/health/ready >/dev/null; then break; fi
            if [ "$attempt" = 60 ]; then cat /tmp/betcco-api.log; exit 1; fi
            sleep 2
          done

      - name: Enable seeded administrator for UAT sign-in
        run: |
          docker run --rm --network host \
            -e PGPASSWORD="uat-${{ github.run_id }}" \
            postgres:16@sha256:a3b7f434b2dc57ce85a67e171163eb8ab1a1ebcb39d27484661f26b1dfbe30d6 \
            psql -h 127.0.0.1 -U betcco_uat -d betcco_uat \
            -c "UPDATE \"AspNetUsers\" SET \"MustChangePassword\" = false WHERE \"Email\" = 'admin-uat@betcco.test';"

      - name: Build production frontend
        run: pnpm --dir frontend build

      - name: Prepare standalone frontend
        run: |
          cp -R frontend/public frontend/.next-uat/standalone/public
          mkdir -p frontend/.next-uat/standalone/.next-uat
          cp -R frontend/.next-uat/static frontend/.next-uat/standalone/.next-uat/static

      - name: Prepare local HTTPS for production UAT
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$BETCCO_UAT_TLS_KEY" \
            -out "$BETCCO_UAT_TLS_CERT" \
            -days 1 \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

      - name: Run full UAT browser matrix
        run: pnpm --dir frontend exec playwright test --config=playwright.uat.config.ts tests/e2e/full-uat.spec.ts

      - name: Upload UAT report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: betcco-full-uat-report
          path: |
            frontend/playwright-report
            frontend/test-results
            /tmp/betcco-api.log
          if-no-files-found: ignore
          retention-days: 14
